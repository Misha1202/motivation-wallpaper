name: Refresh quotes

on:
  schedule:
    # Каждый понедельник в 05:00 UTC, после деплоя.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать новые цитаты
        run: python3 tools/fetch_quotes.py --workers 4 --delay 0.2

      - name: Закоммитить изменения
        run: |
          if git diff --quiet -- web/quotes.json; then
            echo "Новых цитат нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/quotes.json
          git commit -m "chore: обновить цитаты"
          git push
