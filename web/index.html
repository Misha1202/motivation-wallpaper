<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Библейские обои</title>
    <meta
      name="description"
      content="Онлайн-генератор библейских обоев: новая цитата и новый фон при каждом обновлении. Бесплатно, без регистрации."
    />
    <meta name="theme-color" content="#07070b" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preload" href="fonts/pt-serif-700-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <span class="brand">Слово</span>
        <span class="meta">1170 × 2532</span>
      </header>

      <section class="stage" id="stage" aria-label="Обои. Нажми, чтобы создать новые">
        <img id="wallpaper" class="wallpaper" alt="Библейские обои" draggable="false" />
        <div class="skeleton" id="skeleton" aria-hidden="true"></div>
      </section>

      <div class="controls">
        <button class="btn btn-primary" id="refresh" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" />
          </svg>
          Новые обои
        </button>
        <button class="btn btn-icon" id="download" type="button" aria-label="Скачать обои" title="Скачать">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 19h16" />
          </svg>
        </button>
        <button class="btn btn-icon" id="share" type="button" aria-label="Поделиться" title="Поделиться">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V3m0 0 4 4m-4-4L8 7M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" />
          </svg>
        </button>
      </div>

      <p class="hint">
        Тап по картинке или свайп — новые обои.<br />
        На телефоне удерживай картинку, чтобы сохранить в галерею.
      </p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
